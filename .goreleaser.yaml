# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: install-sync

builds:
  - main: ./cmd/install-sync
    binary: install-sync
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

# release-please writes the changelog and creates the GitHub release;
# goreleaser only attaches the binaries to it.
changelog:
  disable: true

release:
  mode: keep-existing
