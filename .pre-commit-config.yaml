# Local hooks only: they use the Go toolchain on PATH, so nothing to pin here.
repos:
  - repo: local
    hooks:
      - id: gofmt
        name: gofmt
        entry: sh -c 'out=$(gofmt -l .); [ -z "$out" ] || { echo "$out"; exit 1; }'
        language: system
        pass_filenames: false
        types: [go]
      - id: go-vet
        name: go vet
        entry: go vet ./...
        language: system
        pass_filenames: false
        types: [go]
      - id: go-test
        name: go test
        entry: go test ./...
        language: system
        pass_filenames: false
        types: [go]
